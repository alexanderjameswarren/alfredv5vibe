
[functions.mcp]
enabled = true
verify_jwt = false
import_map = "./functions/mcp/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/mcp/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/mcp/*.html" ]

[functions.ai-enrich]
enabled = true
verify_jwt = true
import_map = "./functions/ai-enrich/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/ai-enrich/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/ai-enrich/*.html" ]

[functions.push-send]
enabled = true
# JWT verification ON. This is called from the browser by a logged-in user, so
# the user's token is the auth and RLS scopes the query to their own rows.
# Deliberately unlike [functions.mcp], which handles its own OAuth and must set
# verify_jwt = false.
verify_jwt = true
import_map = "./functions/push-send/deno.json"
entrypoint = "./functions/push-send/index.ts"

[functions.sam-song-scores]
enabled = true
# JWT verification ON. Called by a logged-in user (the browser, or the backfill
# console script) with their own token; RLS confines it to their songs. Same
# shape as push-send. Analyzer port M4.
verify_jwt = true
import_map = "./functions/sam-song-scores/deno.json"
entrypoint = "./functions/sam-song-scores/index.ts"

[functions.email-capture]
enabled = true
# 🛑 JWT verification OFF. Called by Postmark's inbound webhook, which has no
# user token and cannot present one — same situation as notify-dispatch below.
#
# ⚠️ BUT NOT THE SAME PROTECTION. notify-dispatch is guarded by a shared secret
# in the x-dispatch-secret header, checked before any work. THIS FUNCTION HAS NO
# SECRET. The only gate is that the To address must match one of the
# hard-coded patterns in USER_MAPPINGS; anything else is refused. So the
# endpoint is effectively public, and anyone who learns the URL and the address
# shape can put a row in the inbox. recipes@secorus.com (added 2026-09-25) is a
# plain address rather than a plus-tag, so it is easier to guess than the
# others — same blast radius, slightly wider door.
#
# That is survivable rather than fine, and worth knowing rather than
# discovering: the inbox is the human-approval gate, so the blast radius is junk
# to triage, not data written anywhere that matters. If this ever needs
# hardening, a shared secret in the Postmark webhook URL is the cheap fix.
#
# ⚠️ ADDED 2026-09-21, and the reason matters. There was NO entry here at all,
# while production ran with verify_jwt = false. The CLI defaults the flag to
# TRUE when nothing declares it, so a bare `supabase functions deploy
# email-capture` would have flipped it and silently 401'd every Postmark
# webhook — email capture would have stopped, with no error anywhere visible.
# It survived only because that deploy passed --no-verify-jwt by hand. This
# entry is what makes the next deploy safe without anyone remembering.
#
# See also the reset warning on notify-dispatch: the flag has gone back to true
# on its own in this project before. Re-check after every deploy.
verify_jwt = false
import_map = "./functions/email-capture/deno.json"
entrypoint = "./functions/email-capture/index.ts"

[functions.notify-dispatch]
enabled = true
# 🛑 JWT verification OFF. Called by pg_cron via pg_net, which has no user token
# and cannot present one. The shared secret in the x-dispatch-secret header is
# what stands in front of this function instead, checked before any work.
#
# ⚠️ THIS FLAG HAS RESET SILENTLY ON REDEPLOY IN THIS PROJECT. Re-check it after
# every deploy — the post-deploy verification is in
# docs/progress-notification-chains.md and takes one curl.
verify_jwt = false
import_map = "./functions/notify-dispatch/deno.json"
entrypoint = "./functions/notify-dispatch/index.ts"

[functions.clip-capture]
enabled = true
# 🛑 JWT verification OFF. Called by the Chrome extension and by scripts/clip.mjs.
# Neither holds a Supabase session, and neither can get one: spec decision 5
# ruled out a pasted login token because those expire in about an hour.
#
# The shared secret in the x-clipboard-secret header is what stands in front of
# this function instead — CLIPBOARD_SECRET, at least 32 bytes, compared with a
# length check plus timingSafeEqual, checked before the body is even read. Same
# protection as notify-dispatch, and deliberately NOT the email-capture pattern,
# which has no secret at all.
#
# ⚠️ THIS ENTRY EXISTS BEFORE THE FIRST DEPLOY, ON PURPOSE. The CLI defaults
# verify_jwt to TRUE when nothing declares it, and email-capture ran for months
# with no entry here, surviving only because one deploy happened to pass
# --no-verify-jwt by hand. This block is what makes every future
# `supabase functions deploy clip-capture` safe without anyone remembering.
#
# ⚠️ THE FLAG HAS RESET SILENTLY ON REDEPLOY IN THIS PROJECT. Re-check after
# every deploy: `supabase functions list` plus one unauthenticated curl, which
# must come back 401 with this function's own JSON body (`{"ok":false,...}`)
# rather than the gateway's. See docs/progress-clipboard.md.
verify_jwt = false
import_map = "./functions/clip-capture/deno.json"
entrypoint = "./functions/clip-capture/index.ts"
