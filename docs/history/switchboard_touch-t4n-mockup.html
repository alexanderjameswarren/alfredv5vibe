<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Switchboard touch mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E7EC; --rail:#CDD2DA; --railBtn:#F7F8FA; --railText:#1F2633; --line:#B4BBC6;
  --red:#C62828; --onRed:#FFFFFF; --orange:#F57C00; --onOrange:#1A1200;
  --yellow:#FBC02D; --onYellow:#1A1600; --green:#2E7D32; --onGreen:#FFFFFF;
  --grey:#7A8494; --onGrey:#FFFFFF;
  --gap:10px; --railW:120px; --barH:64px;
  --nameSize:30px; --actSize:26px; --metaSize:18px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1C222C;--rail:#262E3A;--railBtn:#34404F;--railText:#EEF1F5;--line:#3D4858;--grey:#4E5868;--onGrey:#DDE2EA}
}
:root[data-theme="dark"]{--bg:#1C222C;--rail:#262E3A;--railBtn:#34404F;--railText:#EEF1F5;--line:#3D4858;--grey:#4E5868;--onGrey:#DDE2EA}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--railText);
  font-family:"Atkinson Hyperlegible",Verdana,"Segoe UI",sans-serif;
  -webkit-user-select:none;user-select:none;overflow:hidden;-webkit-touch-callout:none}
.shell{display:flex;flex-direction:column;height:100%}

/* title bar */
.bar{height:var(--barH);flex:none;display:flex;align-items:stretch;gap:8px;padding:8px var(--gap) 0;}
.move{flex:1;min-width:0;border:0;border-radius:12px;background:var(--rail);color:var(--railText);font:inherit;
  font-weight:700;font-size:22px;display:flex;align-items:center;gap:18px;padding:0 16px;cursor:pointer;text-align:left}
.move .title{font-size:24px}
.move .stat{font-size:20px;opacity:.9;white-space:nowrap}
.move .hint{margin-left:auto;font-size:16px;opacity:.7;white-space:nowrap}
.barBtn{border:0;border-radius:12px;background:var(--railBtn);color:var(--railText);font:inherit;font-weight:700;
  font-size:18px;padding:0 14px;cursor:pointer;min-width:110px}
.barBtn.mock{min-width:80px;font-size:16px;opacity:.75}
.move:active,.barBtn:active{filter:brightness(1.2)}
.move:focus-visible,.barBtn:focus-visible{outline:4px solid var(--railText)}

.app{flex:1;min-height:0;display:flex}
.tiles{flex:1;min-width:0;height:100%;overflow-y:auto;padding:var(--gap);
  scroll-snap-type:y mandatory;scrollbar-width:none;touch-action:pan-y}
.tiles::-webkit-scrollbar{display:none}
.grid{display:grid;gap:var(--gap)}
.tile{scroll-snap-align:start;border:0;border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;
  justify-content:space-between;text-align:left;font:inherit;cursor:pointer;position:relative;overflow:hidden;min-height:0;touch-action:pan-y}
.tile:focus-visible{outline:4px solid var(--railText);outline-offset:2px}
.tile.pressed{filter:brightness(1.15)}
.t-red{background:var(--red);color:var(--onRed)} .t-orange{background:var(--orange);color:var(--onOrange)}
.t-yellow{background:var(--yellow);color:var(--onYellow)} .t-green{background:var(--green);color:var(--onGreen)}
.t-grey{background:var(--grey);color:var(--onGrey)}
.tile.chat{box-shadow:inset 0 0 0 6px rgba(255,255,255,.55)}
.name{font-weight:700;line-height:1.05;font-size:var(--nameSize);overflow-wrap:anywhere;position:relative}
.action{font-weight:700;line-height:1.1;font-size:var(--actSize);position:relative}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:var(--metaSize);font-weight:700;opacity:.9;position:relative}
.kind{border:2px solid currentColor;border-radius:8px;padding:0 8px}
/* long-press fill */
.fill{position:absolute;inset:0;background:rgba(0,0,0,.28);transform:scaleX(0);transform-origin:left;pointer-events:none}
.tile.holding .fill{transform:scaleX(1);transition:transform var(--hold) linear}

.rail{width:var(--railW);flex:none;display:flex;flex-direction:column;gap:var(--gap);padding:var(--gap) var(--gap) var(--gap) 0}
.rb{flex:1;border:0;border-radius:12px;background:var(--railBtn);color:var(--railText);font:inherit;font-weight:700;font-size:20px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.rb .big{font-size:48px;line-height:1}
.rb:active{filter:brightness(1.2)} .rb:focus-visible{outline:4px solid var(--railText)}
.rb.off{opacity:.3} .rb.more{background:var(--yellow);color:var(--onYellow)}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--railText);color:var(--bg);font-weight:700;font-size:22px;padding:10px 20px;border-radius:12px;
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <button class="move" id="move">
      <span class="title">Switchboard</span>
      <span class="stat">main: free</span>
      <span class="stat">db: ken build</span>
      <span class="hint">Tap to move to main screen</span>
    </button>
    <button class="barBtn" id="git">Refresh git</button>
    <button class="barBtn mock" id="layoutBtn">3 × 3</button>
  </header>
  <div class="app">
    <main class="tiles" id="tiles"><div class="grid" id="grid"></div></main>
    <nav class="rail" aria-label="Scroll">
      <button class="rb" id="up"><span class="big">▲</span><span id="upCount"></span></button>
      <button class="rb" id="down"><span class="big">▼</span><span id="downCount"></span></button>
    </nav>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const HOLD = 600; // ms for long press
document.documentElement.style.setProperty("--hold", HOLD+"ms");
let data = [
  {g:"cli", c:"red",    name:"switchboard touch", act:"Approve",      step:"s3"},
  {g:"cli", c:"orange", name:"job search",        act:"Send cli",     step:"s5"},
  {g:"cli", c:"yellow", name:"sight reader",      act:"Paste prompt", step:"s2b"},
  {g:"cli", c:"yellow", name:"claims followup",   act:"Your turn",    step:"s4"},
  {g:"cli", c:"green",  name:"ken build",         act:"Working 3:41", step:"s6"},
  {g:"cli", c:"green",  name:"inbox triage",      act:"Working 0:48", step:"s2"},
  {g:"chat",c:"yellow", name:"Jazz thread",       act:"Reply ready",  step:""},
  {g:"chat",c:"green",  name:"Fantasy novel",     act:"Writing 0:22", step:""},
  {g:"chat",c:"yellow", name:"Insurance claim",   act:"Reply ready",  step:""},
  {g:"paused",c:"grey", name:"alfred split",      act:"Paused 2h",    step:"s3", was:"yellow"},
  {g:"paused",c:"grey", name:"dj review",         act:"Paused 1d",    step:"s1", was:"yellow"}
];
data.forEach((d,i)=>d.id=i);
const layouts=[{id:"3 × 3",cols:3,rows:3},{id:"3 × 2",cols:3,rows:2}];
let L=0;
const groupRank={cli:0,chat:1,paused:2}, colorRank={red:0,orange:1,yellow:2,green:3,grey:4};
const grid=document.getElementById("grid"), tiles=document.getElementById("tiles"), toastEl=document.getElementById("toast");
function toast(t){toastEl.textContent=t;toastEl.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove("show"),1500)}

function sorted(){return [...data].sort((a,b)=>groupRank[a.g]-groupRank[b.g]||colorRank[a.c]-colorRank[b.c]||a.id-b.id)}

function render(keepScroll){
  const lay=layouts[L], st=tiles.scrollTop;
  grid.style.gridTemplateColumns=`repeat(${lay.cols},minmax(0,1fr))`;
  grid.innerHTML="";
  sorted().forEach(d=>{
    const b=document.createElement("button");
    b.className=`tile t-${d.c}`+(d.g==="chat"?" chat":"");
    b.innerHTML=`<span class="fill"></span><div class="name">${d.name}</div><div class="action">${d.act}</div>
      <div class="meta"><span class="kind">${d.g==="chat"?"Chat":"CLI"}</span><span>${d.step}</span></div>`;
    wire(b,d); grid.appendChild(b);
  });
  document.getElementById("layoutBtn").textContent=lay.id;
  sizeRows(); tiles.scrollTop=keepScroll?st:0; counts();
}

function wire(b,d){
  let timer=null, fired=false, sx=0, sy=0;
  const cancel=()=>{clearTimeout(timer);timer=null;b.classList.remove("holding")};
  b.addEventListener("contextmenu",e=>e.preventDefault());
  b.addEventListener("pointerdown",e=>{
    if(d.g==="chat"){fired=false;return}
    fired=false;sx=e.clientX;sy=e.clientY;b.classList.add("holding");
    timer=setTimeout(()=>{fired=true;b.classList.remove("holding");togglePause(d)},HOLD);
  });
  b.addEventListener("pointermove",e=>{if(timer&&Math.hypot(e.clientX-sx,e.clientY-sy)>12)cancel()});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,cancel));
  b.addEventListener("click",e=>{
    if(fired){e.preventDefault();fired=false;return}
    b.classList.add("pressed");setTimeout(()=>b.classList.remove("pressed"),150);
    toast("Opening "+d.name);
  });
}
function togglePause(d){
  if(d.g==="paused"){d.g="cli";d.c=d.was||"yellow";d.act="Your turn";toast("Unpaused "+d.name)}
  else{d.was=d.c;d.g="paused";d.c="grey";d.act="Paused now";toast("Paused "+d.name)}
  if(navigator.vibrate)navigator.vibrate(30);
  render(true);
}

let rowH=0;
function sizeRows(){
  const lay=layouts[L], gap=10, h=tiles.clientHeight-gap*2;
  rowH=(h-gap*(lay.rows-1))/lay.rows; grid.style.gridAutoRows=rowH+"px";
}
function counts(){
  const r0=tiles.getBoundingClientRect(); let above=0,below=0;
  grid.querySelectorAll(".tile").forEach(t=>{const r=t.getBoundingClientRect();
    if(r.bottom<=r0.top+2)above++; else if(r.top>=r0.bottom-2)below++;});
  const up=document.getElementById("up"), dn=document.getElementById("down");
  document.getElementById("upCount").textContent=above?above+" more":"";
  document.getElementById("downCount").textContent=below?below+" more":"";
  up.classList.toggle("off",!above); dn.classList.toggle("off",!below); dn.classList.toggle("more",!!below);
}
function page(dir){tiles.scrollBy({top:dir*(rowH+10)*layouts[L].rows,behavior:"smooth"})}
document.getElementById("up").onclick=()=>page(-1);
document.getElementById("down").onclick=()=>page(1);
document.getElementById("layoutBtn").onclick=()=>{L=(L+1)%layouts.length;render()};
document.getElementById("move").onclick=()=>toast("Would move Switchboard to your main screen");
document.getElementById("git").onclick=()=>toast("Would refresh git status");
tiles.addEventListener("scroll",counts,{passive:true});
window.addEventListener("resize",()=>{sizeRows();counts()});
render();
</script>
</body>
</html>
